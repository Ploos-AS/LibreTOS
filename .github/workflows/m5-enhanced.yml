name: M5 Enhanced

on:
  push:
  pull_request:

jobs:
  m5-enhanced:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Atari/MiNT toolchain and Hatari
        run: |
          sudo add-apt-repository -y ppa:vriviere/ppa
          sudo apt-get update
          sudo apt-get install -y cross-mint-essential hatari xvfb git make
      - name: Qualify M5.4 Atari TT030 enhanced interfaces
        env:
          HATARI_TIMEOUT_SECONDS: 60
        run: make qualify-m5-enhanced
      - name: Upload M5.4 TT030 enhanced evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libretos-m5-tt030-enhanced-evidence
          path: |
            build/m5/tt030/LibreTOS-TT030-68030-512k-us.img
            build/m5/tt030/SHA256SUMS
            build/m5/tt030/BUILDINFO.txt
            build/m5/tt030-enhanced/
          if-no-files-found: warn
