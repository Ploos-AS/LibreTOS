name: M8 Amiga Interrupt

on:
  push:
  pull_request:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Qualify M8.6 interrupt contract
        run: make qualify-m8-interrupt
      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: m8-amiga-interrupt
          path: build/m8/interrupt/
