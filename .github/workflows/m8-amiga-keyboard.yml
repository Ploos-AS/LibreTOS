name: M8 Amiga Keyboard

on:
  push:
  pull_request:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Qualify M8.5 keyboard contract
        run: make qualify-m8-keyboard
      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: m8-amiga-keyboard
          path: build/m8/keyboard/
