name: M8 Amiga Native Boot

on:
  push:
    branches: [main]
    paths:
      - 'config/m8-amiga-ocs-68000.json'
      - 'src/amiga/**'
      - 'tools/qualify_m8_amiga_profile.py'
      - 'tools/qualify_m8_amiga_startup.py'
      - 'tools/qualify_m8_amiga_boot.py'
      - 'Makefile'
      - '.github/workflows/m8-amiga-boot.yml'
  pull_request:
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout qualified amiga-dev toolchain
        uses: actions/checkout@v4
        with:
          repository: Ploos-AS/amiga-dev
          path: amiga-dev
      - name: Build amiga-dev toolchain image
        run: docker build -t amiga-dev:m1 amiga-dev
      - name: Build native Amiga 68000 artifact
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace amiga-dev:m1 make build-m8-amiga-native
      - name: Verify native ROM envelope
        run: test "$(wc -c < build/m8/native/LibreTOS-Amiga-OCS-68000-1M.rom)" -eq 524288
      - name: Qualify M8.3 native Amiga boot contract
        run: make qualify-m8-boot
      - name: Upload M8.3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: m8-amiga-boot-evidence
          path: |
            build/m8/boot/
            build/m8/native/
