name: M5 Qualification

on:
  push:
  pull_request:

jobs:
  m5-qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Atari/MiNT toolchain and Hatari
        run: bash tools/install_mint_ci.sh
      - name: Run aggregate M5.5 Atari TT030 qualification
        env:
          HATARI_TIMEOUT_SECONDS: 60
        run: make qualify-m5
      - name: Upload M5.5 TT030 aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libretos-m5-tt030-qualification-evidence
          path: |
            build/m5/qualification/
            build/m5/tt030/LibreTOS-TT030-68030-512k-us.img
            build/m5/tt030/SHA256SUMS
            build/m5/tt030/BUILDINFO.txt
            build/m5/tt030-boot/
            build/m5/tt030-platform/
            build/m5/tt030-enhanced/
          if-no-files-found: warn
