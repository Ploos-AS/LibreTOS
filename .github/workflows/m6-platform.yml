name: M6 Platform

on:
  push:
  pull_request:

jobs:
  m6-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Atari/MiNT toolchain and Hatari
        run: bash tools/install_mint_ci.sh
      - name: Build and qualify M6.3 Atari Falcon030 platform
        env:
          HATARI_TIMEOUT_SECONDS: 60
        run: make qualify-m6-platform
      - name: Upload M6.3 Falcon030 evidence and ROM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libretos-m6-falcon030-platform-evidence
          path: |
            build/m6/falcon030-platform/
            build/m6/falcon030/LibreTOS-Falcon030-68030-512k-us.img
          if-no-files-found: warn
