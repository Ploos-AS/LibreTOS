name: M8 Amiga Video

on:
  push:
  pull_request:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Qualify M8.8 OCS display contract
        run: make qualify-m8-video
      - name: Upload qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: m8-amiga-video
          path: build/m8/video/
