name: CI

on:
  push:
  pull_request:

jobs:
  m0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Qualify M0
        run: make qualify-m0

  target-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify permanent Atari target matrix
        run: make qualify-target-matrix

  m3-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Qualify M3.1 Atari STe/68000 profile
        run: make qualify-m3-profile

  m3-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Atari/MiNT toolchain and Hatari
        run: |
          sudo add-apt-repository -y ppa:vriviere/ppa
          sudo apt-get update
          sudo apt-get install -y cross-mint-essential hatari xvfb git make
      - name: Build and qualify M3.2 Atari STe boot
        run: make qualify-m3-boot
      - name: Upload M3.2 STe evidence and ROM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libretos-m3-ste-boot-evidence
          path: |
            build/m3/ste/LibreTOS-STe-68000-192k-us.img
            build/m3/ste/SHA256SUMS
            build/m3/ste/BUILDINFO.txt
            build/m3/ste-boot/
          if-no-files-found: warn

  m2-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Qualify M2 ST/68000 profile
        run: make qualify-m2-profile

  m1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Atari/MiNT toolchain and Hatari
        run: |
          sudo add-apt-repository -y ppa:vriviere/ppa
          sudo apt-get update
          sudo apt-get install -y cross-mint-essential hatari xvfb git make
      - name: Qualify M1
        run: make qualify-m1
      - name: Upload M1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libretos-m1-evidence
          path: |
            build/m1/SHA256SUMS
            build/m1/BUILDINFO.txt
            build/m1/hatari.log
          if-no-files-found: warn

  m2-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Atari/MiNT toolchain and Hatari
        run: |
          sudo add-apt-repository -y ppa:vriviere/ppa
          sudo apt-get update
          sudo apt-get install -y cross-mint-essential hatari xvfb git make
      - name: Qualify M2.2 boot regression
        run: make qualify-m2-boot
      - name: Upload M2.2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libretos-m2-boot-evidence
          path: build/m2/boot/
          if-no-files-found: warn

  m2-gemdos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Atari/MiNT toolchain and Hatari
        run: |
          sudo add-apt-repository -y ppa:vriviere/ppa
          sudo apt-get update
          sudo apt-get install -y cross-mint-essential hatari xvfb git make
      - name: Qualify M2.3 GEMDOS regression
        run: make qualify-m2-gemdos
      - name: Upload M2.3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libretos-m2-gemdos-evidence
          path: |
            build/m2/gemdos/PROFILE.json
            build/m2/gemdos/ROM.sha256
            build/m2/gemdos/PROBE.sha256
            build/m2/gemdos/HATARI_PROFILE.json
            build/m2/gemdos/RESULT.txt
            build/m2/gemdos/hatari.log
          if-no-files-found: warn

  m2-aes-vdi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Atari/MiNT toolchain and Hatari
        run: |
          sudo add-apt-repository -y ppa:vriviere/ppa
          sudo apt-get update
          sudo apt-get install -y cross-mint-essential hatari xvfb git make
      - name: Qualify M2.4 AES/VDI regression
        run: make qualify-m2-aes-vdi
      - name: Upload M2.4 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libretos-m2-aes-vdi-evidence
          path: |
            build/m2/aes-vdi/PROFILE.json
            build/m2/aes-vdi/ROM.sha256
            build/m2/aes-vdi/PROBE.sha256
            build/m2/aes-vdi/HATARI_PROFILE.json
            build/m2/aes-vdi/RESULT.txt
            build/m2/aes-vdi/hatari.log
          if-no-files-found: warn

  m2-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Atari/MiNT toolchain and Hatari
        run: |
          sudo add-apt-repository -y ppa:vriviere/ppa
          sudo apt-get update
          sudo apt-get install -y cross-mint-essential hatari xvfb git make
      - name: Qualify M2.5 floppy/media regression
        run: make qualify-m2-media
      - name: Upload M2.5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libretos-m2-media-evidence
          path: |
            build/m2/media/PROFILE.json
            build/m2/media/ROM.sha256
            build/m2/media/PROBE.sha256
            build/m2/media/HATARI_PROFILE.json
            build/m2/media/RESULT.json
            build/m2/media/DISKS.sha256
            build/m2/media/hatari-a.log
            build/m2/media/hatari-b.log
          if-no-files-found: warn

  m2-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Atari/MiNT toolchain and Hatari
        run: |
          sudo add-apt-repository -y ppa:vriviere/ppa
          sudo apt-get update
          sudo apt-get install -y cross-mint-essential hatari xvfb git make
      - name: Run aggregate M2.6 qualification
        run: make qualify-m2
      - name: Upload M2.6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libretos-m2-qualification-evidence
          path: |
            build/m2/qualification/
            build/m2/boot/
            build/m2/gemdos/
            build/m2/aes-vdi/
            build/m2/media/
          if-no-files-found: warn
