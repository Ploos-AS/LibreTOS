name: M7 BIOS XBIOS Coverage

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Qualify M7.3 BIOS/XBIOS coverage
        run: make qualify-m7-bios-xbios
      - name: Upload M7.3 evidence
        uses: actions/upload-artifact@v4
        with:
          name: libretos-m7-bios-xbios-evidence
          path: build/m7/bios-xbios/
