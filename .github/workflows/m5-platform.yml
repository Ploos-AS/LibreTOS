name: M5 Platform

on:
  push:
  pull_request:

jobs:
  m5-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Atari/MiNT toolchain and Hatari
        run: |
          sudo add-apt-repository -y ppa:vriviere/ppa
          sudo apt-get update
          sudo apt-get install -y cross-mint-essential hatari xvfb git make
      - name: Qualify M5.3 Atari TT030 platform contract
        env:
          HATARI_TIMEOUT_SECONDS: 60
        run: make qualify-m5-platform
      - name: Upload M5.3 TT030 platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libretos-m5-tt030-platform-evidence
          path: |
            build/m5/tt030/LibreTOS-TT030-68030-512k-us.img
            build/m5/tt030-platform/
          if-no-files-found: warn
